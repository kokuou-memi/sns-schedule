<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, no-ai">
    <meta name="googlebot" content="noindex, nofollow, noarchive, no-ai">
    <title>配信スケジュール＆告知管理ツール (一括追加対応版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf4f8', 100: '#fbe8f1', 500: '#ec4899', 600: '#db2777', 750: '#9d174d' }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased" x-data="managerApp()">

    <!-- セキュリティ・ステータスヘッダー -->
    <header class="bg-slate-900 text-slate-200 border-b border-slate-800 px-4 py-3 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <h1 class="font-bold text-base tracking-wide text-white">配信企画・スケジュール管理ダッシュボード</h1>
            </div>
            <div class="flex items-center gap-3 text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 text-slate-300">
                <span>💾 ルーティン一括追加・自動保存対応</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- タブ切り替え -->
        <div class="flex border-b border-slate-200 mb-6 gap-2">
            <button @click="activeTab = 'schedule'" :class="activeTab === 'schedule' ? 'border-brand-600 text-brand-600 font-bold bg-white' : 'border-transparent text-slate-500 hover:text-slate-700'" class="px-5 py-2.5 border-b-2 text-sm transition rounded-t-lg">
                📅 解禁・配信スケジュール
            </button>
            <button @click="activeTab = 'posts'" :class="activeTab === 'posts' ? 'border-brand-600 text-brand-600 font-bold bg-white' : 'border-transparent text-slate-500 hover:text-slate-700'" class="px-5 py-2.5 border-b-2 text-sm transition rounded-t-lg">
                📝 告知ポスト文案ストック (<span x-text="posts.length"></span>)
            </button>
        </div>

        <!-- tab1: スケジュール管理 -->
        <div x-show="activeTab === 'schedule'" class="space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">タイムライン＆解禁フロー</h2>
                    <p class="text-xs text-slate-500">通常の追加のほか、毎週のルーティンを一括で登録できます。</p>
                </div>
                <button @click="openScheduleModal()" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                    <span>＋ スケジュール追加</span>
                </button>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 divide-y divide-slate-100 overflow-hidden">
                <template x-for="(item, index) in schedules" :key="item.id">
                    <div class="p-5 hover:bg-slate-50/60 transition flex flex-col md:flex-row md:items-center justify-between gap-4" :class="item.isSubItem ? 'bg-slate-50/40 pl-8 md:pl-12 border-l-4 border-brand-500' : ''">
                        <div class="space-y-1.5 flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="px-2.5 py-0.5 rounded-md text-xs font-bold" :class="item.isSubItem ? 'bg-indigo-100 text-indigo-700' : 'bg-pink-100 text-brand-700'" x-text="formatDateDisplay(item.date)"></span>
                                <span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded" x-text="item.time"></span>
                                <span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-medium" x-text="'担当: ' + item.assignee"></span>
                                <span x-show="item.isSubItem" class="text-xs text-brand-600 font-semibold">↳ サブ項目</span>
                            </div>
                            <h3 class="text-base font-bold text-slate-800" x-text="item.title"></h3>
                            <p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed" x-text="item.description"></p>
                        </div>
                        <div class="flex items-center gap-1.5 self-end md:self-center shrink-0">
                            <button @click="moveSchedule(index, -1)" :disabled="index === 0" class="p-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed" title="上に移動">▲</button>
                            <button @click="moveSchedule(index, 1)" :disabled="index === schedules.length - 1" class="p-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed" title="下に移動">▼</button>
                            <span class="w-px h-4 bg-slate-200 mx-1"></span>
                            <button @click="editSchedule(index)" class="px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">編集</button>
                            <button @click="deleteSchedule(index)" class="px-3 py-1.5 text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition">削除</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- tab2: 告知ポスト文案ストック -->
        <div x-show="activeTab === 'posts'" class="space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">告知ポスト文案ストック</h2>
                    <p class="text-xs text-slate-500">文案の並び替え、メディア管理ができます。</p>
                </div>
                <button @click="openPostModal()" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                    <span>＋ 新規ポスト追加</span>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="(post, index) in posts" :key="post.id">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between space-y-4 hover:shadow-md transition">
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-slate-100 text-slate-700" x-text="post.category"></span>
                                    <button @click="movePost(index, -1)" :disabled="index === 0" class="px-1.5 py-0.5 text-[10px] bg-slate-100 hover:bg-slate-200 rounded text-slate-600 disabled:opacity-30 disabled:cursor-not-allowed">◀ 左/上</button>
                                    <button @click="movePost(index, 1)" :disabled="index === posts.length - 1" class="px-1.5 py-0.5 text-[10px] bg-slate-100 hover:bg-slate-200 rounded text-slate-600 disabled:opacity-30 disabled:cursor-not-allowed">右/下 ▶</button>
                                </div>
                                <span class="text-xs text-slate-400" x-text="post.charCount + '文字'"></span>
                            </div>
                            <p class="text-sm text-slate-700 whitespace-pre-wrap bg-slate-50 p-3 rounded-lg border border-slate-100 leading-relaxed font-mono" x-text="post.content"></p>
                            
                            <div x-show="post.mediaData" class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-2">
                                <div class="flex items-center justify-between text-xs font-bold text-slate-700">
                                    <span class="truncate">🖼️ 添付ファイル: <span class="font-normal text-slate-600" x-text="post.mediaName"></span></span>
                                    <a :href="post.mediaData" :download="post.mediaName" class="text-brand-600 hover:text-brand-700 underline font-semibold flex items-center gap-1 shrink-0">
                                        📥 ダウンロード
                                    </a>
                                </div>
                                <template x-if="post.mediaType && post.mediaType.startsWith('image/')">
                                    <div class="relative rounded-lg overflow-hidden border border-slate-200 bg-black/5 max-h-40 flex items-center justify-center">
                                        <img :src="post.mediaData" class="max-h-40 object-contain">
                                    </div>
                                </template>
                                <template x-if="post.mediaType && post.mediaType.startsWith('video/')">
                                    <div class="relative rounded-lg overflow-hidden border border-slate-200 bg-black max-h-40">
                                        <video :src="post.mediaData" controls class="max-h-40 w-full object-contain"></video>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                            <div class="flex gap-2">
                                <button @click="editPost(index)" class="px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">編集</button>
                                <button @click="deletePost(index)" class="px-3 py-1.5 text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition">削除</button>
                            </div>
                            <button @click="copyText(post.content, index)" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-1">
                                <span x-text="post.copied ? '✓ コピーしました！' : '文章をコピー'"></span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- スケジュール追加・編集モーダル（一括追加タブ対応） -->
    <div x-show="showScheduleModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-lg font-bold text-slate-800" x-text="isEditingSchedule ? 'スケジュールを編集' : '新規スケジュール追加'"></h3>
                <!-- 新規追加のときだけ「個別 / 毎週一括」の切り替えタブを表示 -->
                <div x-show="!isEditingSchedule" class="flex bg-slate-100 p-1 rounded-lg text-xs font-semibold">
                    <button @click="scheduleMode = 'single'" :class="scheduleMode === 'single' ? 'bg-white text-brand-600 shadow-sm' : 'text-slate-500'" class="px-3 py-1.5 rounded-md transition">個別追加</button>
                    <button @click="scheduleMode = 'recurring'" :class="scheduleMode === 'recurring' ? 'bg-white text-brand-600 shadow-sm' : 'text-slate-500'" class="px-3 py-1.5 rounded-md transition">🔄 毎週一括追加</button>
                </div>
            </div>
            
            <!-- 【モード1】個別追加・編集 -->
            <div x-show="scheduleMode === 'single' || isEditingSchedule" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">日付（カレンダーから選択）</label>
                    <input type="date" x-model="scheduleForm.date" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">時間指定（例: 時間指定なし、20:00〜）</label>
                    <input type="text" x-model="scheduleForm.time" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">タスク名・イベント名</label>
                    <input type="text" x-model="scheduleForm.title" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">担当者（例: 全員、国愛めみ、任意）</label>
                    <input type="text" x-model="scheduleForm.assignee" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">詳細説明・準備物など</label>
                    <textarea rows="3" x-model="scheduleForm.description" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="subItemCheck" x-model="scheduleForm.isSubItem" class="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500">
                    <label for="subItemCheck" class="text-xs font-bold text-slate-700 cursor-pointer">一段下げたサブ項目（例: 再生リスト・HPへの反映など）にする</label>
                </div>
            </div>

            <!-- 【モード2】毎週ルーティン一括追加 -->
            <div x-show="scheduleMode === 'recurring' && !isEditingSchedule" class="space-y-3">
                <div class="bg-pink-50 border border-pink-100 p-3 rounded-lg text-xs text-brand-700 leading-relaxed">
                    💡 指定した曜日（例：毎週月曜日）に、開始日から終了日まで一括でスケジュールを自動作成します。
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">開始日（いつから）</label>
                        <input type="date" x-model="recurringForm.startDate" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">終了日（いつまで）</label>
                        <input type="date" x-model="recurringForm.endDate" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">繰り返す曜日</label>
                    <select x-model="recurringForm.dayOfWeek" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                        <option value="1">毎週月曜日</option>
                        <option value="2">毎週火曜日</option>
                        <option value="3">毎週水曜日</option>
                        <option value="4">毎週木曜日</option>
                        <option value="5">毎週金曜日</option>
                        <option value="6">毎週土曜日</option>
                        <option value="0">毎週日曜日</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">時間指定（例: 18:00、7:00まで など）</label>
                    <input type="text" x-model="recurringForm.time" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">タスク名・イベント名</label>
                    <input type="text" x-model="recurringForm.title" placeholder="例: 月曜日のぽけぱれTV" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">担当者</label>
                    <input type="text" x-model="recurringForm.assignee" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">詳細説明・準備物など</label>
                    <textarea rows="2" x-model="recurringForm.description" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="recurringSubItem" x-model="recurringForm.isSubItem" class="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500">
                    <label for="recurringSubItem" class="text-xs font-bold text-slate-700 cursor-pointer">一段下げたサブ項目にする</label>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button @click="showScheduleModal = false" class="px-4 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">キャンセル</button>
                <button @click="saveSchedule()" class="px-5 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition shadow" x-text="scheduleMode === 'recurring' && !isEditingSchedule ? '一括追加する' : '保存する'"></button>
            </div>
        </div>
    </div>

    <!-- ポスト追加・編集モーダル -->
    <div x-show="showPostModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800" x-text="isEditingPost ? '告知ポストを編集' : '新規ポスト追加'"></h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">カテゴリー（例: 解禁日用、当日用、テンプレート）</label>
                    <input type="text" x-model="postForm.category" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">ポスト本文</label>
                    <textarea rows="4" x-model="postForm.content" class="w-full text-sm font-mono border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="ポスト文案を入力..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">画像・映像ファイルを添付（選択またはドラッグ）</label>
                    <input type="file" @change="handleFileSelect($event)" accept="image/*,video/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-brand-700 hover:file:bg-pink-100 cursor-pointer border border-slate-300 rounded-lg p-1.5">
                </div>
                <div x-show="postForm.mediaData" class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-700 truncate">プレビュー: <span class="font-normal" x-text="postForm.mediaName"></span></span>
                        <button type="button" @click="postForm.mediaData = ''; postForm.mediaName = ''; postForm.mediaType = ''" class="text-rose-600 hover:underline">ファイルを外す</button>
                    </div>
                    <template x-if="postForm.mediaType && postForm.mediaType.startsWith('image/')">
                        <img :src="postForm.mediaData" class="max-h-32 mx-auto object-contain rounded">
                    </template>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button @click="showPostModal = false" class="px-4 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">キャンセル</button>
                <button @click="savePost()" class="px-5 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition shadow">保存する</button>
            </div>
        </div>
    </div>

    <script>
        function managerApp() {
            return {
                activeTab: 'schedule',
                showScheduleModal: false,
                isEditingSchedule: false,
                editingScheduleIndex: null,
                scheduleMode: 'single', // 'single' または 'recurring'
                scheduleForm: { id: '', date: '', time: '', title: '', assignee: '', description: '', isSubItem: false },
                recurringForm: { startDate: '', endDate: '', dayOfWeek: '1', time: '18:00', title: '月曜日のぽけぱれTV', assignee: '全員', description: '', isSubItem: false },

                showPostModal: false,
                isEditingPost: false,
                editingPostIndex: null,
                postForm: { id: '', category: '', content: '', mediaName: '', mediaData: '', mediaType: '' },

                schedules: [],
                posts: [],

                init() {
                    const savedSchedules = localStorage.getItem('vtuber_app_schedules');
                    if (savedSchedules) {
                        this.schedules = JSON.parse(savedSchedules);
                    } else {
                        this.schedules = [
                            { id: 1, date: '2026-12-09', time: '時間指定なし', title: 'Xで告知、枠立て解禁', assignee: '任意', description: 'ポストのテンプレート、画像・映像共有', isSubItem: false },
                            { id: 2, date: '2026-12-12', time: '時間指定なし', title: '限定公開で初配信リレーの枠立て', assignee: '全員', description: '全員: URL共有', isSubItem: false },
                            { id: 3, date: '2026-12-12', time: '時間指定なし', title: '再生リスト・HPへの反映', assignee: '国愛めみ', description: '共有されたURLを再生リスト・HPへ反映', isSubItem: true },
                            { id: 4, date: '2026-12-15', time: '時間指定なし', title: '各枠で配信・説明', assignee: '全員', description: '解禁情報＆初配信リレーの説明（再生リストとHP解禁）', isSubItem: false }
                        ];
                        this.persistSchedules();
                    }

                    const savedPosts = localStorage.getItem('vtuber_app_posts');
                    if (savedPosts) {
                        this.posts = JSON.parse(savedPosts);
                    } else {
                        this.posts = [
                            { id: 1, category: '解禁日用（12/9）', content: '📢 【情報解禁】\n12月15日(火)より初配信リレーを開催いたします！\n詳細は各メンバーのチャンネルをチェックしてね🍄✧ ˚\n#ぽけぱれ', mediaName: '', mediaData: '', mediaType: '', charCount: 65, copied: false },
                            { id: 2, category: '当日・リレー用テンプレート', content: '✨本日22:00より初配信リレー開始✨\nそれぞれの枠でお待ちしております！\n👇再生リストはこちら\n[URL]\n#ぽけぱれ', mediaName: '', mediaData: '', mediaType: '', charCount: 68, copied: false }
                        ];
                        this.persistPosts();
                    }
                },

                persistSchedules() {
                    localStorage.setItem('vtuber_app_schedules', JSON.stringify(this.schedules));
                },
                persistPosts() {
                    localStorage.setItem('vtuber_app_posts', JSON.stringify(this.posts));
                },

                moveSchedule(index, direction) {
                    const newIndex = index + direction;
                    if (newIndex < 0 || newIndex >= this.schedules.length) return;
                    const item = this.schedules.splice(index, 1)[0];
                    this.schedules.splice(newIndex, 0, item);
                    this.persistSchedules();
                },

                movePost(index, direction) {
                    const newIndex = index + direction;
                    if (newIndex < 0 || newIndex >= this.posts.length) return;
                    const item = this.posts.splice(index, 1)[0];
                    this.posts.splice(newIndex, 0, item);
                    this.persistPosts();
                },

                formatDateDisplay(dateStr) {
                    if (!dateStr) return '';
                    if (!dateStr.includes('-')) return dateStr;
                    
                    const parts = dateStr.split('-');
                    if (parts.length !== 3) return dateStr;
                    
                    const year = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10);
                    const day = parseInt(parts[2], 10);
                    
                    const d = new Date(year, month - 1, day);
                    const days = ['日', '月', '火', '水', '木', '金', '土'];
                    const dayOfWeek = days[d.getDay()];
                    
                    return `${month}月${day}日(${dayOfWeek})`;
                },

                openScheduleModal() {
                    this.isEditingSchedule = false;
                    this.scheduleMode = 'single';
                    const today = new Date().toISOString().split('T')[0];
                    this.scheduleForm = { id: Date.now(), date: today, time: '時間指定なし', title: '', assignee: '全員', description: '', isSubItem: false };
                    this.recurringForm = { startDate: today, endDate: today, dayOfWeek: '1', time: '18:00', title: '月曜日のぽけぱれTV', assignee: '全員', description: '', isSubItem: false };
                    this.showScheduleModal = true;
                },
                editSchedule(index) {
                    this.isEditingSchedule = true;
                    this.scheduleMode = 'single';
                    this.editingScheduleIndex = index;
                    this.scheduleForm = { ...this.schedules[index] };
                    this.showScheduleModal = true;
                },
                saveSchedule() {
                    if (this.isEditingSchedule) {
                        this.schedules[this.editingScheduleIndex] = { ...this.scheduleForm };
                    } else if (this.scheduleMode === 'recurring') {
                        // 毎週一括追加のロジック
                        const start = new Date(this.recurringForm.startDate);
                        const end = new Date(this.recurringForm.endDate);
                        const targetDay = parseInt(this.recurringForm.dayOfWeek, 10);

                        if (isNaN(start.getTime()) || isNaN(end.getTime()) || start > end) {
                            alert('正しい開始日と終了日を設定してください。');
                            return;
                        }

                        // 開始日から終了日までループして指定曜日に一致する日付を抽出
                        let curr = new Date(start);
                        let addedCount = 0;
                        while (curr <= end) {
                            if (curr.getDay() === targetDay) {
                                const year = curr.getFullYear();
                                const month = String(curr.getMonth() + 1).padStart(2, '0');
                                const day = String(curr.getDate()).padStart(2, '0');
                                const dateStr = `${year}-${month}-${day}`;

                                this.schedules.push({
                                    id: Date.now() + Math.random(),
                                    date: dateStr,
                                    time: this.recurringForm.time,
                                    title: this.recurringForm.title,
                                    assignee: this.recurringForm.assignee,
                                    description: this.recurringForm.description,
                                    isSubItem: this.recurringForm.isSubItem
                                });
                                addedCount++;
                            }
                            curr.setDate(curr.getDate() + 1);
                        }

                        if (addedCount === 0) {
                            alert('指定された期間内に該当する曜日の日付が見つかりませんでした。');
                            return;
                        }
                    } else {
                        this.schedules.push({ ...this.scheduleForm, id: Date.now() });
                    }
                    this.persistSchedules();
                    this.showScheduleModal = false;
                },
                deleteSchedule(index) {
                    if (confirm('このスケジュール項目を削除しますか？')) {
                        this.schedules.splice(index, 1);
                        this.persistSchedules();
                    }
                },

                openPostModal() {
                    this.isEditingPost = false;
                    this.postForm = { id: Date.now(), category: '告知用', content: '', mediaName: '', mediaData: '', mediaType: '' };
                    this.showPostModal = true;
                },
                editPost(index) {
                    this.isEditingPost = true;
                    this.editingPostIndex = index;
                    this.postForm = { ...this.posts[index] };
                    this.showPostModal = true;
                },
                handleFileSelect(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    this.postForm.mediaName = file.name;
                    this.postForm.mediaType = file.type;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.postForm.mediaData = e.target.result;
                    };
                    reader.readAsDataURL(file);
                },
                savePost() {
                    const charCount = this.postForm.content.length;
                    if (this.isEditingPost) {
                        this.posts[this.editingPostIndex] = { ...this.postForm, charCount, copied: false };
                    } else {
                        this.posts.push({ ...this.postForm, charCount, copied: false, id: Date.now() });
                    }
                    this.persistPosts();
                    this.showPostModal = false;
                },
                deletePost(index) {
                    if (confirm('このポスト文案を削除しますか？')) {
                        this.posts.splice(index, 1);
                        this.persistPosts();
                    }
                },

                copyText(text, index) {
                    navigator.clipboard.writeText(text).then(() => {
                        this.posts[index].copied = true;
                        setTimeout(() => {
                            this.posts[index].copied = false;
                        }, 2000);
                    });
                }
            }
        }
    </script>
</body>
